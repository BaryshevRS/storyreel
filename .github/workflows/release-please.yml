name: release-please

on:
  push:
    branches: [main]
  # Manual trigger: recovery path when a release exists but never published.
  # A release created with GITHUB_TOKEN cannot trigger another workflow, so
  # publish has to live in this file rather than react to `release: published`.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url: it makes setup-node write a placeholder authToken into
      # .npmrc, which forces token auth and 404s. Without it npm uses the default
      # registry and the OIDC trusted-publisher flow (needs npm >= 11.5.1 = Node 24).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Publish on a normal Release Please release and also recover from a
      # version bump that reached main without being published. This keeps a
      # manual workflow dispatch safe: an existing version is a clean no-op.
      - name: Check whether the CLI version is already published
        id: package
        working-directory: packages/cli
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "storyreel@$version" version --json >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.package.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      # Full gate: a release that cannot build or pass its tests never reaches
      # npm. prepublishOnly only bundles, so the checks belong here.
      - if: steps.package.outputs.publish == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.package.outputs.publish == 'true'
        run: pnpm build
      - if: steps.package.outputs.publish == 'true'
        run: pnpm test
      # Only `storyreel` publishes; the four workspace packages are private:true
      # and get inlined into it. npm (not pnpm recursive publish) performs the
      # OIDC exchange with the Trusted Publisher; provenance is automatic.
      - name: Publish storyreel ${{ steps.package.outputs.version }}
        if: steps.package.outputs.publish == 'true'
        working-directory: packages/cli
        run: npm publish --access public
