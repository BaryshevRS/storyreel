# ONE-TIME bootstrap. Delete this file after it has run successfully.
#
# npm cannot create a brand-new package name over OIDC: a trusted publisher is
# attached to an existing package, and the npmjs.com UI will not let you
# configure one for a name that has never been published
# (https://github.com/npm/cli/issues/8544). So the first storyreel release has
# to go out with a token. Everything after it goes through release-please.yml,
# which uses OIDC and stores no credentials.
#
# To use, once:
#   1. npmjs.com → Access Tokens → Generate → Granular, with publish rights
#   2. this repo → Settings → Secrets → Actions → new secret NPM_TOKEN
#   3. Actions → bootstrap-publish → Run workflow
#   4. npmjs.com → storyreel → Settings → Trusted Publisher:
#        repository BaryshevRS/storyreel, workflow release-please.yml
#   5. delete this file and the NPM_TOKEN secret
name: bootstrap-publish (one-time)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Same release gate as the real workflow: never ship a build that fails.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
